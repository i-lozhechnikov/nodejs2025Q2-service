services:
  node:
    build:
      context: .
      target: node-dev
    env_file:
      - .env
    networks:
      - library
    ports:
      - ${PORT}:${PORT}
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      - postgres

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    restart: unless-stopped
    networks:
      - library
    volumes:
      - postgres:/var/lib/postgresql/data

networks:
  library:
    driver: bridge

volumes:
  postgres:
